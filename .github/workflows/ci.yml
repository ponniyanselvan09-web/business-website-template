name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js (adjust version if needed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Show available npm scripts (debugging step)
      - name: Show npm scripts
        run: npm run

      # 5. Run tests (skip if no "test" script exists)
      - name: Run tests
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping..."
          fi

      # 6. Build project (skip if no "build" script exists)
      - name: Build project
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found, skipping..."
          fi

      # 7. Upload build artifacts (only if build/ folder exists)
      - name: Upload production-ready files
        if: success() && (hashFiles('build/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
